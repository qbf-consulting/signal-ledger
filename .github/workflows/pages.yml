name: Publication Conformance

on:
  pull_request:
    paths:
      - "src/signal_ledger/publication.py"
      - "tests/test_publication.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify publication contract
        run: pytest tests/test_publication.py

# Public deployment authority belongs exclusively to operational.yml.
# This workflow preserves the deterministic publication contract without
# competing for the github-pages environment.
