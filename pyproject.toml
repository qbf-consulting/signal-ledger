[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-ledger"
version = "0.1.0"
description = "Evidence-backed change intelligence primitives for governed observations and provenance."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "QBF Consulting LLP"}]
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.9,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]

[project.scripts]
signal-ledger = "signal_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
